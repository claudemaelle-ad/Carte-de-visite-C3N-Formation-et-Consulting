<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carole Fa Houi — C3N Formation et Consulting</title>
<meta name="description" content="Carole Fa Houi, formatrice indépendante — Secrétariat médical, techniques de secrétariat, bureautique.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500;1,6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --card:#1035ac;
    --ink:#ffffff;
    --black:#ffffff;
    --muted:rgba(255,255,255,0.72);
    --blue:#1035ac;
    --green:#009e60;
    --line:rgba(255,255,255,0.28);
    --radius:22px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    color:#152142;
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 18px 60px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(21,33,66,0.04), 0 18px 40px -22px rgba(21,33,66,0.18);
    padding:44px 34px 36px;
    position:relative;
    overflow:hidden;
  }

  /* ---- Mark reveal ---- */
  .mark-wrap{
    width:min(200px, 56%);
    aspect-ratio:1 / 1;
    margin:0 auto 26px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#ffffff;
    box-shadow:0 10px 24px -12px rgba(8,20,50,0.35);
    clip-path: circle(0% at 34% 50%);
    animation: reveal 1.15s cubic-bezier(.22,.85,.32,1) 0.15s forwards;
    overflow:hidden;
  }
  .mark-wrap img{
    display:block;
    width:74%;
    height:auto;
    opacity:0;
    transform:scale(0.92);
    animation: settle 0.9s ease-out 0.15s forwards;
  }
  @keyframes reveal{
    to{ clip-path: circle(75% at 34% 50%); }
  }
  @keyframes settle{
    to{ opacity:1; transform:scale(1); }
  }

  .intro{
    text-align:center;
    opacity:0;
    transform:translateY(10px);
    animation: rise 0.8s ease-out 0.55s forwards;
  }

  @keyframes rise{
    to{ opacity:1; transform:translateY(0); }
  }

  .role{
    font-family:'Newsreader', serif;
    font-style:italic;
    font-weight:500;
    font-size:16px;
    color:var(--green);
    margin:0 0 8px;
  }

  .org{
    font-family:'Newsreader', serif;
    font-weight:500;
    font-size:19px;
    color:var(--black);
    margin:0;
    letter-spacing:0.01em;
  }

  .divider{
    height:1px;
    background:var(--line);
    margin:26px 0;
    border:none;
  }

  .domains{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    text-align:left;
    gap:9px;
  }

  .domains li{
    font-size:14.5px;
    color:var(--ink);
    padding-left:11px;
    position:relative;
    line-height:1.4;
  }

  .domains li::before{
    content:"";
    position:absolute;
    left:0;
    top:8px;
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--green);
  }

  .cta{
    display:block;
    width:100%;
    text-align:center;
    background:var(--green);
    color:#fff;
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    padding:14px 20px;
    border-radius:12px;
    margin-top:26px;
    transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    box-shadow:0 10px 22px -12px rgba(0,158,96,0.45);
  }
  .cta:hover{
    background:#00814e;
    transform:translateY(-1px);
    box-shadow:0 14px 26px -12px rgba(0,158,96,0.55);
  }
  .cta:active{ transform:translateY(0); }

  .contact-list{
    margin-top:22px;
    display:flex;
    flex-direction:column;
    gap:13px;
  }

  .contact-row{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:10px;
    text-decoration:none;
    color:var(--black);
    font-size:14.5px;
    font-weight:600;
    padding:8px 4px;
    border-radius:10px;
    transition: background 0.15s ease;
    text-align:left;
  }
  a.contact-row:hover{ background:rgba(255,255,255,0.1); }

  .contact-row .icon{
    width:19px;
    height:19px;
    flex-shrink:0;
    color:var(--green);
  }

  .note{
    display:block;
    text-align:left;
    font-size:11.5px;
    color:var(--muted);
    font-weight:400;
    margin-top:2px;
  }

  .links{
    display:flex;
    gap:10px;
    margin-top:24px;
  }

  .link-btn{
    flex:1;
    text-align:center;
    text-decoration:none;
    font-size:13.5px;
    font-weight:500;
    color:var(--black);
    border:1px solid var(--line);
    padding:12px 10px;
    border-radius:12px;
    transition: border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
  }
  .link-btn:hover{
    border-color:rgba(255,255,255,0.6);
    background:rgba(255,255,255,0.1);
    transform:translateY(-1px);
  }

  footer{
    text-align:center;
    margin-top:30px;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.01em;
  }
</style>
</head>
